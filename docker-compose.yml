services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: simple-cms-api:latest
    restart: unless-stopped
    env_file: /etc/simplecms/config.env
    volumes:
      - api-data:/var/lib/simplecms
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  api-data:
  caddy-data:
  caddy-config:
